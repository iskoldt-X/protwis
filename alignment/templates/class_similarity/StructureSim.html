{% extends "home/base.html" %}
{% load static %}
{% load utils %}

{% block content %}
<div class="container">
  <h3>Structure similarity</h3>
  <div id="sim-status">Loading…</div>

  <!-- state toggle -->
  <div style="margin:8px 0;">
    <button class="btn btn-primary btn-sm state-btn" data-state="inactive">Inactive</button>
    <button class="btn btn-default btn-sm state-btn" data-state="active">Active</button>
  </div>

  <div style="margin:8px 0;">
    <button class="btn btn-primary btn-sm colorby" data-key="Class">Class</button>
    <button class="btn btn-default  btn-sm colorby" data-key="Ligand type">Ligand type</button>
    <button class="btn btn-default  btn-sm colorby" data-key="Receptor family">Receptor family</button>
    <button class="btn btn-default btn-sm colorby" data-key="Physiological ligand">Physiological ligand</button>
    <button class="btn btn-default btn-sm colorby" data-key="Sense">Sense</button>
  </div>

  <div style="margin:4px 0 8px;">
    <span style="margin-right:4px;">Shape by:</span>
    <button class="btn btn-primary btn-xs shapeby" data-key="Class">Class</button>
  </div>

  <!-- NEW: external plot title that we update from JS -->
  <h4 id="plot-title" class="text-center" style="margin: 10px 0 5px;">
    Inactive structures
  </h4>

  <div id="plot" style="min-height: 540px;"></div>
</div>
{% endblock %}

{% block addon_js %}
<script src="{% static 'home/js/plotly_v1_58_5.js' %}"></script>
<script>
(async function () {
  const statusEl    = document.getElementById('sim-status');
  const plotTitleEl = document.getElementById('plot-title');
  const plotDiv     = document.getElementById('plot');

  const EMBED_URLS = {
    inactive: "{{ inactive_embed_url }}",
    active:   "{{ active_embed_url }}",
  };

  const PALETTE = [
    '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
    '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf'
  ];

  const CLASS_COLORS = {
    'A':     '#1f77b4',
    'B1':    '#ff7f0e',
    'B2':    '#2ca02c',
    'O1':    '#d62728',
    'O2':    '#9467bd',
    'C':     '#8c564b',
    'F':     '#e377c2',
    'T2':    '#7f7f7f',
    'Other': '#bcbd22'
  };

  const PHYSIO_COLORS = {
    'Peptide/protein': '#1b9e77',
    'Small-molecule':  '#d95f02',
    'Ion':             '#7570b3',
    'Orphan':         '#7f7f7f',
    'Other':           '#666666'
  };

  const SENSE_COLORS = {
    'non-sensory': '#1f78b4',
    'odorant':     '#e31a1c',
    'taste':       '#33a02c',
    'unknown':     '#b2b2b2',
    'vision':      '#6a3d9a'
  };

  const GROUP_GRADIENTS = {
    'Peptide/protein': [
      '#006d2c','#238b45','#41ab5d','#74c476','#a1d99b','#c7e9c0'
    ],
    'Small-molecule': [
      '#7f2704','#a63603','#d94801','#f16913','#fd8d3c','#fdae6b'
    ],
    'Ion': [
      '#08519c','#2171b5','#4292c6','#6baed6','#9ecae1','#c6dbef'
    ],
    'Orphan': [
      '#3f3f3f','#525252','#737373','#969696','#bdbdbd','#d9d9d9'
    ],
    'Other': [
      '#7f3b08','#b35806','#e08214','#fdb863','#fee0b6','#f7f7f7'
    ]
  };

  const PHYSIO_GROUP_ORDER = [
    'Peptide/protein',
    'Small-molecule',
    'Ion',
    'Orphan'
  ];

  const CLASS_ORDER = ['A','B1','B2','C','F','O1','O2','T2'];

  /* ---------------- small helpers ---------------- */

  function plain(html) {
    const div = document.createElement('div');
    div.innerHTML = html || '';
    return (div.textContent || div.innerText || '').trim();
  }

  function normEntry(entry) {
    const raw = String(entry || '').toUpperCase();
    return raw.replace(/_HUMAN$/i, '');
  }

  function getCategory(point, key, meta) {
    if (key === 'Physiological ligand')
      return meta.physio_ligand_consensus || 'Unknown';

    if (key === 'Class')
      return meta.protein_class   || point.Class            || 'Other';
    if (key === 'Ligand type')
      return meta.ligand_type     || point['Ligand type']   || 'Unknown';
    if (key === 'Receptor family')
      return meta.receptor_family || point['Receptor family'] || 'Unknown';
    if (key === 'Sense')
      return meta.sense           || point.Sense            || 'unknown';

    return 'Unknown';
  }

  function normClassCodeFromString(cls) {
    let s = String(cls || '').toUpperCase();
    if (!s) return 'Other';
    if (s.includes('CLASS B1')) return 'B1';
    if (s.includes('CLASS B2')) return 'B2';
    if (s.includes('CLASS O1')) return 'O1';
    if (s.includes('CLASS O2')) return 'O2';
    if (s.includes('CLASS T2')) return 'T2';
    if (s.includes('CLASS C'))  return 'C';
    if (s.includes('CLASS F'))  return 'F';
    if (s.includes('CLASS A'))  return 'A';
    return 'Other';
  }

  function normClassCode(meta) {
    return normClassCodeFromString(meta.protein_class);
  }

  function getShapeCategory(meta, shapeKey) {
    // we only actually use 'Class' now
    return normClassCode(meta) || 'Other';
  }

  function getShapeFor(shapeCat, shapeKey) {
    // shapeKey is always 'Class' in current UI
    switch (shapeCat) {
      case 'A':  return 'circle';
      case 'B1': return 'star-triangle-up';
      case 'B2': return 'star-triangle-down';
      case 'O1': return 'star-square';
      case 'O2': return 'star-diamond';
      case 'C':  return 'pentagon';
      case 'F':  return 'hexagram';
      case 'T2': return 'diamond-wide';
      default:   return 'circle-open';
    }
  }

    function physioGroupForConsensus(consensus) {
    const s = (consensus || '').trim().toLowerCase();

    // empty / unknown / orphan → Orphan group
    if (!s || s === 'unknown' || s === 'orphan') {
      return 'Orphan';
    }

    if (s === 'ion') {
      return 'Ion';
    }

    // Small-molecule categories
    if (s.includes('small-molecule')) {
      return 'Small-molecule';
    }

    // Cleaved-endterm | PPI should behave like peptide/protein group
    if (s === 'cleaved-endterm | ppi') {
      return 'Peptide/protein';
    }

    // Anything explicitly mentioning peptide / protein
    if (s.includes('peptide') || s.includes('protein')) {
      return 'Peptide/protein';
    }

    return 'Other';
  }


  function physioGroupOrderIndex(groupLabel) {
    const idx = PHYSIO_GROUP_ORDER.indexOf(groupLabel);
    return idx === -1 ? 99 : idx;
  }

  function chooseBucketColor(colorKey, bucket, groupColorMaps, defaultColorMap) {
    const g = bucket.physioGroup || 'Other';

    if (colorKey === 'Class') {
      const code = normClassCodeFromString(bucket.colorCat) || 'Other';
      return CLASS_COLORS[code] || CLASS_COLORS['Other'] || '#999999';
    }

    if (colorKey === 'Physiological ligand') {
      const grp = physioGroupForConsensus(bucket.physio) || g;
      return PHYSIO_COLORS[grp] || '#999999';
    }

    if (colorKey === 'Sense') {
      const s = (bucket.colorCat || '').trim().toLowerCase();
      if (s in SENSE_COLORS) return SENSE_COLORS[s];
      return SENSE_COLORS['unknown'];
    }

    if ((colorKey === 'Ligand type' || colorKey === 'Receptor family') &&
        groupColorMaps && groupColorMaps[g] && groupColorMaps[g].has(bucket.colorCat)) {
      return groupColorMaps[g].get(bucket.colorCat);
    }

    if (defaultColorMap && defaultColorMap.has(bucket.colorCat)) {
      return defaultColorMap.get(bucket.colorCat);
    }
    return '#999999';
  }

  function compareBuckets(a, b) {
    const ga = physioGroupOrderIndex(a.physioGroup);
    const gb = physioGroupOrderIndex(b.physioGroup);
    if (ga < gb) return -1;
    if (ga > gb) return 1;

    if (a.shapeCat < b.shapeCat) return -1;
    if (a.shapeCat > b.shapeCat) return 1;
    if (a.colorCat < b.colorCat) return -1;
    if (a.colorCat > b.colorCat) return 1;
    return 0;
  }

  let currentState  = 'inactive';
  let colorKey      = 'Class';
  let shapeKey      = 'Class';
  const dataCache   = {};
  let legendHandlersAttached = false;

  /* --------------------- buildTraces --------------------- */

  function buildTraces(points, proteins, key, shapeKey) {
    const GROUP_BY_PHYSIO_KEYS = [
      'Class',
      'Ligand type',
      'Receptor family',
      'Physiological ligand',
      'Sense'
    ];
    const shouldGroupByPhysio = GROUP_BY_PHYSIO_KEYS.includes(key);

    const colorCats            = new Set();
    const perPointColor        = [];
    const perPointShapeCat     = [];
    const perPointPhysio       = [];
    const perPointPhysioGroup  = [];

    for (let i = 0; i < points.length; i++) {
      const p    = points[i];
      const meta = proteins[p.label] || {};
      const cCat = getCategory(p, key, meta) || 'Unknown';
      const sCat = getShapeCategory(meta, shapeKey);
      const physio = meta.physio_ligand_consensus || 'Unknown';
      const group  = physioGroupForConsensus(physio);

      perPointColor.push(cCat);
      perPointShapeCat.push(sCat);
      perPointPhysio.push(physio);
      perPointPhysioGroup.push(group);
      colorCats.add(cCat);
    }

    const colorCatList = Array.from(colorCats).sort();
    const colorMap = new Map(colorCatList.map((c,i) => [c, PALETTE[i % PALETTE.length]]));

    const bucketsById = {};

    for (let i = 0; i < points.length; i++) {
      const p    = points[i];
      const meta = proteins[p.label] || {};

      const colorCat    = perPointColor[i];
      const classCode   = perPointShapeCat[i];
      const physio      = perPointPhysio[i];
      const physioGroup = perPointPhysioGroup[i];

      const id = colorCat + '|||' + classCode + '|||' + physioGroup;

      if (!bucketsById[id]) {
        bucketsById[id] = {
          id,
          colorCat,
          shapeCat: classCode,
          physio,
          physioGroup,
          xs: [],
          ys: [],
          texts: []
        };
      }

      const entry = normEntry(meta.protein_entry);
      const name  = plain(meta.protein_name);
      const pdb   = meta.pdb_code || p.label || '';

      const sense = meta.sense || '';
      const senseLine = sense ? `Sense: ${sense}<br>` : '';

      const consensus = physio;
      const rawList   = Array.isArray(meta.physio_ligand_types_raw)
        ? meta.physio_ligand_types_raw.filter(Boolean).join(', ')
        : '';
      const physioLine = consensus
        ? `Physiological ligand: ${consensus}${rawList ? ` <span style="color:#666">(${rawList})</span>` : ''}<br>`
        : '';

      const line1 = (entry && name) ? `${entry} — ${name}` : (entry || name || pdb);
      const line2 = `PDB: ${pdb}`;
      const line3 = `${key}: ${colorCat}`;

      bucketsById[id].texts.push(`${line1}<br>${physioLine}${senseLine}${line2}<br>${line3}`);
      bucketsById[id].xs.push(p.x);
      bucketsById[id].ys.push(p.y);
    }

    const bucketList = [];
    for (const id in bucketsById) {
      const b = bucketsById[id];
      bucketList.push({
        id: b.id,
        colorCat: b.colorCat,
        shapeCat: b.shapeCat,
        physio: b.physio,
        physioGroup: b.physioGroup,
        xs: b.xs,
        ys: b.ys,
        texts: b.texts
      });
    }

    let groupColorMaps = null;
    if (key === 'Ligand type' || key === 'Receptor family') {
      groupColorMaps = {};
      const catsByGroup = {};
      for (const b of bucketList) {
        const g = b.physioGroup || 'Other';
        if (!catsByGroup[g]) catsByGroup[g] = new Set();
        catsByGroup[g].add(b.colorCat);
      }
      for (const g in catsByGroup) {
        const cats = Array.from(catsByGroup[g]).sort();
        const palette = GROUP_GRADIENTS[g] || PALETTE;
        const m = new Map();
        cats.forEach((c, i) => {
          m.set(c, palette[i % palette.length]);
        });
        groupColorMaps[g] = m;
      }
    }

    const traces = [];

    if (shouldGroupByPhysio) {

      const legendProxyTraces = {}; // physio|colorCat → index of proxy legend trace

      for (const groupLabel of PHYSIO_GROUP_ORDER) {
        const groupBuckets = bucketList
          .filter(b => b.physioGroup === groupLabel)
          .sort(compareBuckets);

        if (!groupBuckets.length) continue;

        /* -------------------- HEADER -------------------- */
        traces.push({
          x: [NaN], y: [NaN],
          type: 'scatter',
          mode: 'markers',
          marker: { size: 0, color: 'rgba(0,0,0,0)' },
          name: `<b>${groupLabel}</b>`,
          hoverinfo: 'skip',
          showlegend: true,
          _kind: 'header',
          _physioGroup: groupLabel
        });

        /* -------------------- CATEGORY PROXIES -------------------- */
        // Determine category list for this physio group
        const cats = [...new Set(groupBuckets.map(b => b.colorCat))].sort();

        for (const cat of cats) {
          const color = chooseBucketColor(key, {colorCat:cat, physioGroup:groupLabel}, groupColorMaps, colorMap);

          traces.push({
            x: [NaN, NaN],
            y: [NaN, NaN],
            type: 'scatter',
            mode: 'lines',
            line: { width: 8, color: color },
            name: cat,
            hoverinfo: 'skip',
            showlegend: true,
            _kind: 'legend-proxy',
            _physioGroup: groupLabel,
            _colorCat: cat
          });
        }

        /* -------------------- REAL BUCKET TRACES -------------------- */
        for (const b of groupBuckets) {
          const color = chooseBucketColor(key, b, groupColorMaps, colorMap);

          traces.push({
            x: b.xs,
            y: b.ys,
            type: 'scatter',
            mode: 'markers',
            marker: {
              size: 9,
              line: { width: 0.5, color: '#000' },
              color: color,
              symbol: getShapeFor(b.shapeCat, shapeKey)
            },
            name: b.colorCat,
            hoverinfo: 'text',
            text: b.texts,
            showlegend: false, // REAL traces do not appear in legend
            _kind: 'bucket',
            _physioGroup: groupLabel,
            _colorCat: b.colorCat,
            _classCode: b.shapeCat
          });
        }
      }

    } else {
      /* ---------------- SIMPLE LEGEND ---------------- */

      const cats = [...new Set(bucketList.map(b => b.colorCat))].sort();

      for (const cat of cats) {
        const sample = bucketList.find(b => b.colorCat === cat);
        const color = chooseBucketColor(key, sample, groupColorMaps, colorMap);

        traces.push({
          x:[NaN,NaN],
          y:[NaN,NaN],
          type:'scatter',
          mode:'lines',
          line:{ width:8, color:color },
          name: cat,
          hoverinfo:'skip',
          showlegend:true,
          _kind:'legend-proxy',
          _colorCat:cat
        });
      }

      for (const b of bucketList) {
        const color = chooseBucketColor(key, b, groupColorMaps, colorMap);

        traces.push({
          x: b.xs,
          y: b.ys,
          type:'scatter',
          mode:'markers',
          marker:{
            size: 9,
            line:{ width:0.5, color:'#000' },
            color: color,
            symbol: getShapeFor(b.shapeCat, shapeKey)
          },
          name:b.colorCat,
          hoverinfo:'text',
          text:b.texts,
          showlegend:false,
          _kind:'bucket',
          _physioGroup:b.physioGroup,
          _colorCat:b.colorCat,
          _classCode:b.shapeCat
        });
      }
    }

  

    // Class legend (always shown, per your Option 1)
    traces.push({
      x: [NaN],
      y: [NaN],
      type: 'scatter',
      mode: 'markers',
      marker: { size: 0, color: 'rgba(0,0,0,0)' },
      name: '<b>Class</b>',
      hoverinfo: 'skip',
      showlegend: true,
      _kind: 'class-header'
    });

    CLASS_ORDER.forEach(cls => {
      traces.push({
        x: [NaN],
        y: [NaN],
        type: 'scatter',
        mode: 'markers',
        marker: {
          size: 9,
          color: '#000',
          symbol: getShapeFor(cls, 'Class')
        },
        name: cls,
        hoverinfo: 'skip',
        showlegend: true,
        _kind: 'classLegend',
        _classCode: cls
      });
    });

    return traces;
  }

  /* ---------------- legend click handlers ---------------- */

function attachLegendHandlersOnce() {
  if (legendHandlersAttached || !plotDiv) return;
  legendHandlersAttached = true;

  plotDiv.on('plotly_legendclick', function (ev) {
    const data  = ev.data || [];
    const trace = data[ev.curveNumber];
    if (!trace) return true;

    const xRange = (plotDiv.layout && plotDiv.layout.xaxis && plotDiv.layout.xaxis.range)
      ? plotDiv.layout.xaxis.range.slice()
      : null;
    const yRange = (plotDiv.layout && plotDiv.layout.yaxis && plotDiv.layout.yaxis.range)
      ? plotDiv.layout.yaxis.range.slice()
      : null;

    function applyVisibility(targetIdxs) {
      if (!targetIdxs.length) return false;

      let anyVisible = false;
      let anyHidden  = false;
      for (const i of targetIdxs) {
        const t = data[i];
        const vis = t.visible;
        if (vis === 'legendonly' || vis === false || vis === 'none') {
          anyHidden = true;
        } else {
          anyVisible = true;
        }
      }
      const newVisible = (anyVisible && !anyHidden) ? 'legendonly' : true;

      Plotly.restyle(plotDiv, { visible: newVisible }, targetIdxs).then(function () {
        if (xRange && yRange) {
          return Plotly.relayout(plotDiv, {
            'xaxis.range': xRange,
            'yaxis.range': yRange
          });
        }
      });

      return false;
    }

    /* ----- 1) Physio headers: toggle whole group (buckets + proxies) ----- */
    if (trace._kind === 'header') {
      const group = trace._physioGroup;
      const idxs  = [];
      for (let i = 0; i < data.length; i++) {
        const t = data[i];
        if (!t) continue;
        if (t._kind === 'bucket' && t._physioGroup === group) {
          idxs.push(i);
        }
        if (t._kind === 'legend-proxy' && t._physioGroup === group) {
          idxs.push(i);
        }
      }
      return applyVisibility(idxs);
    }

    /* ----- 2) Color legend proxies (the lines): toggle buckets + this proxy ----- */
    if (trace._kind === 'legend-proxy') {
      const group = trace._physioGroup || null; // may be null in simple legend mode
      const cat   = trace._colorCat;
      const idxs  = [];

      // all buckets of this category (and group, if defined)
      for (let i = 0; i < data.length; i++) {
        const t = data[i];
        if (!t || t._kind !== 'bucket') continue;
        if (t._colorCat !== cat) continue;
        if (group !== null && t._physioGroup !== group) continue;
        idxs.push(i);
      }
      // include the proxy itself so its line greys out
      idxs.push(ev.curveNumber);

      return applyVisibility(idxs);
    }

    /* ----- 3) Class legend entries: toggle by class code ----- */
    // toggle all receptors of a given class
    if (trace._kind === 'classLegend') {
      const code = trace._classCode;
      const idxs = [];
      for (let i = 0; i < data.length; i++) {
        const t = data[i];
        if (t && t._kind === 'bucket' && t._classCode === code) {
          idxs.push(i);
        }
      }

      // also toggle the legend item itself so it greys out
      idxs.push(ev.curveNumber);

      return applyVisibility(idxs);
    }

    /* ----- 4) Class header: do nothing ----- */
    if (trace._kind === 'class-header') {
      return false;
    }

    // All other traces: default behaviour
    return true;
  });

  plotDiv.on('plotly_legenddoubleclick', function (ev) {
    const data  = ev.data || [];
    const trace = data[ev.curveNumber];
    if (!trace) return true;

    // prevent "show only this trace" for our custom legend items
    if (trace._kind === 'header' ||
        trace._kind === 'legend-proxy' ||
        trace._kind === 'classLegend' ||
        trace._kind === 'class-header') {
      return false;
    }
    return true;
  });
}


  /* ---------------- render & fetch ---------------- */

  function render(state) {
    const cached = dataCache[state];
    if (!cached) return;

    currentState = state;

    plotTitleEl.textContent = (state === 'inactive')
      ? 'Inactive structures'
      : 'Active structures';

    const traces = buildTraces(cached.points, cached.proteins, colorKey, shapeKey);
    const layout = {
      xaxis: { visible: false, showgrid: false, scaleanchor: 'y' },
      yaxis: { visible: false, showgrid: false },
      hovermode: 'closest',
      legend: {
        x: 1.02,
        xanchor: 'left',
        y: 0.5,
        orientation: 'v',
        font: { family: 'Source Code Pro, monospace' }
      },
      margin: { l: 40, r: 200, t: 10, b: 40 },
      paper_bgcolor: '#fff',
      plot_bgcolor: '#fff'
    };

    Plotly.react(plotDiv, traces, layout, { displayModeBar: true, responsive: true });
    attachLegendHandlersOnce();
    requestAnimationFrame(() => { try { Plotly.Plots.resize(plotDiv); } catch(e){} });
  }

  async function fetchState(state, { renderAfter = false } = {}) {
    if (dataCache[state]) {
      if (renderAfter) {
        statusEl.textContent = '';
        render(state);
      }
      return;
    }

    const url = EMBED_URLS[state];
    try {
      const res = await fetch(url, { headers: { 'Accept': 'application/json' }});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (!data.tsne || data.tsne.error) {
        if (renderAfter) {
          statusEl.textContent = data.tsne ? ('Embedding error: ' + data.tsne.error) : 'No embedding';
        }
        return;
      }

      const points   = data.tsne.points || [];
      const proteins = data.proteins     || {};
      if (!points.length) {
        if (renderAfter) statusEl.textContent = 'No points to plot.';
        return;
      }

      dataCache[state] = { points, proteins };

      if (renderAfter) {
        statusEl.textContent = '';
        render(state);
      }

    } catch (e) {
      console.error('fetchState error for', state, e);
      if (renderAfter) statusEl.textContent = 'Failed to load data: ' + e.message;
    }
  }

  /* ---------------- UI wiring ---------------- */

  document.querySelectorAll('.state-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const state = btn.getAttribute('data-state');
      if (!state || state === currentState) return;

      document.querySelectorAll('.state-btn').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-default');
      });
      btn.classList.remove('btn-default');
      btn.classList.add('btn-primary');

      if (dataCache[state]) render(state);
      else fetchState(state, { renderAfter: true });
    });
  });

  document.querySelectorAll('.colorby').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.colorby').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-default');
      });
      btn.classList.remove('btn-default');
      btn.classList.add('btn-primary');
      colorKey = btn.getAttribute('data-key') || 'Class';
      render(currentState);
    });
  });

  document.querySelectorAll('.shapeby').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-key') || 'Class';
      if (key === shapeKey) return;

      document.querySelectorAll('.shapeby').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-default');
      });
      btn.classList.remove('btn-default');
      btn.classList.add('btn-primary');
      shapeKey = key;
      render(currentState);
    });
  });

  window.addEventListener('resize', () => {
    try { Plotly.Plots.resize(plotDiv); } catch (e) {}
  });

  /* ---------------- initial load ---------------- */

  try {
    statusEl.textContent = 'Loading structures…';
    await Promise.all([
      fetchState('inactive'),
      fetchState('active'),
    ]);
    statusEl.textContent = '';
    render('inactive');
  } catch (e) {
    console.error('Initial load error:', e);
    statusEl.textContent = 'Failed to load data: ' + e.message;
  }

})();
</script>

{% endblock %}
